# LiCore 发布流程：推送任意 tag 时构建全部平台二进制、打包、生成校验和、
# 创建 GitHub Release 并上传资产。
#
# 资产设计（8 个 tar.gz + SHA256SUMS = 9 个资产）：
#   - 每个平台一个包，全部是纯 Go（CGO_ENABLED=0）产物，**无 glibc / 无 cgo 依赖**；
#     注意「纯 Go」不等于「一律静态链接」：linux/* 是静态链接，而 android/arm64
#     与 darwin/* 因平台运行时（bionic linker / Mach-O DYLDLINK）本就是动态链接，
#     这与 cgo 无关（v0.7.5 的 Release 就是被这个误解坑过一次，见下方构建校验注释）；
#   - 不再有 -cgo 变体：v0.7.5 起 `licore exec` 改为调用系统的 nsenter
#     （util-linux / Toybox / busybox 均提供），纯 Go 构建即具备完整 exec 能力，
#     因此同一个平台只需一个包；
#   - 每个包内含 licore 二进制 + README.md + LICENSE；
#   - 另出 SHA256SUMS 供安装脚本校验。

name: Release

# 触发：push 任意 tag 都发布（不限制 v* 前缀）。
# 注意：任何 tag 都会触发正式发布——包括随手打的临时 tag。
# 打 tag 前请确认它就是你要发布的版本。
on:
  push:
    tags:
      - "*"

# 创建 Release 需要写权限；其它一律只读。
permissions:
  contents: write

env:
  # 与 go.mod 的 `go` 指令保持一致，低于它会构建失败。
  GO_VERSION: "1.27.1"

jobs:
  # 单一 job 产出全部资产：Release 需要一次性拿到完整文件列表，
  # 拆多 job 反而要 artifact 中转与合并，得不偿失。
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 取回 tag 与其历史，供 Release notes 提取 tag message。
          fetch-depth: 0

      # 误发保护：任何 tag 都会触发本 workflow（含随手打的临时 tag），
      # 但只有版本号形态（v*）才真正创建 Release。非版本 tag 仍会完整
      # 构建与打包——这样能验证发布流程本身，只是不上传、不创建 Release。
      # 用 shell 判断而非 `if:` 表达式，是为了让规则一目了然且可本地复测。
      - name: 判定是否为版本 tag
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*)
              echo "is_version=true" >> "$GITHUB_OUTPUT"
              echo "tag $TAG 是版本 tag，将创建 Release"
              ;;
            *)
              echo "is_version=false" >> "$GITHUB_OUTPUT"
              echo "tag $TAG 不是版本 tag（不匹配 v[0-9]*），只构建不发布"
              ;;
          esac

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建全部平台
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 去掉 tag 的 v 前缀：main.go 的 version 默认是 "0.0.0-dev" 形态，
          # 输出为 "licore version 0.8.0 (linux/amd64)"，与之一致。
          VERSION="${TAG#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          OUT=dist
          mkdir -p "$OUT"

          build() { # goos goarch name
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -ldflags "$LDFLAGS" -o "$OUT/licore-$3" .
          }

          build linux   amd64   linux-amd64
          build linux   arm64   linux-arm64
          build linux   arm     linux-arm
          build linux   386     linux-386
          build linux   riscv64 linux-riscv64
          build android arm64   android-arm64
          build darwin  amd64   darwin-amd64
          build darwin  arm64   darwin-arm64

          echo "构建产物："
          ls -la "$OUT"

          # 校验「零 cgo / 零 libc 依赖」——这是去掉 cgo 的核心收益，不能回退。
          #
          # 判据是 **file 报告里不得出现 libc/cgo 痕迹**，而不是「必须 static」：
          #   - linux/*：CGO_ENABLED=0 的纯 Go 链接器产出 static-pie/static，
          #     应明确报 statically linked；
          #   - android/arm64：bionic 平台**总是**动态链接（interpreter
          #     /system/bin/linker64），与 cgo 无关，静态反而是错的；
          #   - darwin/*：Mach-O 恒带 DYLDLINK，同理。
          # 因此对后两者不能要求 static，只要求「不依赖 glibc」。
          #
          # 另外 `ldd` 在此不可用作判据：在异构 ELF 上它会谎报
          # "not a dynamic executable"（实测对 android/darwin 产物均误报），
          # v0.7.5 首跑就是被这个假阳性/假阴性坑掉的。`file` 只读头部，稳定。
          for bin in "$OUT"/licore-*; do
            name="$(basename "$bin")"
            desc="$(file -b "$bin")"
            case "$name" in
              licore-linux-*)
                case "$desc" in
                  *"statically linked"*|*"static-pie linked"*)
                    echo "OK   $name 静态链接（无 libc 依赖）" ;;
                  *)
                    echo "FAIL $name 不是静态链接，去 cgo 的收益回退了：" >&2
                    echo "     $desc" >&2
                    exit 1 ;;
                esac
                ;;
              *)
                # Android / macOS：平台运行时本就动态，只禁止 glibc 依赖。
                if echo "$desc" | grep -qiE "glibc|GNU/Linux"; then
                  echo "FAIL $name 报告了 glibc 依赖：" >&2
                  echo "     $desc" >&2
                  exit 1
                fi
                echo "OK   $name 动态链接属平台预期（$(echo "$desc" | cut -d, -f2 | sed 's/^ //')），无 glibc 依赖"
                ;;
            esac
          done

          # 补充一道与架构无关的硬证据：Go 在二进制里内嵌了构建设置，
          # 直接读它确认每个产物都是 CGO_ENABLED=0 编出来的。
          #
          # 不用 `strings | grep runtime/cgo`：那会误报——Go runtime 的源码路径
          # 字符串（如 /usr/local/go/src/runtime/cgocall.go）在**静态**产物里
          # 同样存在，与被链接进 cgo 是两回事。实测 linux/amd64 静态产物也有这
          # 三条字符串，按那个判据会把好的产物判死。
          for bin in "$OUT"/licore-*; do
            if ! go version -m "$bin" 2>/dev/null | grep -q "CGO_ENABLED=0"; then
              echo "FAIL $(basename "$bin") 未标记 CGO_ENABLED=0，可能混入了 cgo 构建" >&2
              go version -m "$bin" 2>&1 | grep -E "CGO_ENABLED|GOOS|GOARCH" >&2 || true
              exit 1
            fi
          done
          echo "OK   全部产物的构建设置均为 CGO_ENABLED=0"

      - name: 打包（tar.gz，含 README 与 LICENSE）
        run: |
          set -euo pipefail
          OUT=dist
          for bin in "$OUT"/licore-*; do
            name="$(basename "$bin")"
            # 每个归档内统一叫 licore，解包即可用。
            stage="$(mktemp -d)"
            cp "$bin" "$stage/licore"
            cp README.md LICENSE "$stage/"
            tar -C "$stage" -czf "$OUT/${name}.tar.gz" licore README.md LICENSE
            rm -rf "$stage"
          done
          # 清掉裸二进制，只留归档，避免它们被当作 Release 资产上传。
          find "$OUT" -maxdepth 1 -type f -name 'licore-*' ! -name '*.tar.gz' -delete
          echo "归档列表："
          ls -la "$OUT"

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          echo "SHA256SUMS 内容："
          cat SHA256SUMS

      - name: 自检归档完整性
        # 上传前先确认每个归档都能解开且含预期文件，避免发出坏包。
        run: |
          set -euo pipefail
          cd dist
          for f in ./*.tar.gz; do
            contents="$(tar -tzf "$f" | sort | tr '\n' ' ')"
            for want in LICENSE README.md licore; do
              case "$contents" in
                *"$want"*) ;;
                *) echo "$f 缺少 $want" >&2; exit 1 ;;
              esac
            done
          done
          sha256sum -c SHA256SUMS
          echo "全部归档自检通过"

      - name: 提取 Release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 从 **annotated tag** 的 message 取发布说明；轻量 tag 回落模板。
          #
          # 两个坑，都是实测踩出来的：
          #
          # 1. 不能用"%(contents) 是否为空"判断：对轻量 tag，git 会回落到该 tag
          #    指向的 commit message，于是"空则用模板"的分支永不触发，notes 会
          #    变成一条 commit 日志。
          #
          # 2. **不能只依赖 checkout 之后的本地 tag 对象**。actions/checkout
          #    检出后会用 commit 覆盖同名 tag：
          #      git fetch --no-tags ... origin +<sha>:refs/tags/v0.7.1
          #      t [tag update]  <sha> -> v0.7.1
          #    于是 annotated tag 在本地变成了轻量 tag，cat-file -t 返回
          #    "commit"，v0.7.1 首次发布时 notes 因此退化成了模板。
          #    所以这里先强制把真正的 tag 对象取回来，再判断类型。
          git fetch -q --force --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true

          msg=""
          if [ "$(git cat-file -t "$TAG" 2>/dev/null || echo none)" = "tag" ]; then
            msg="$(git tag -l --format='%(contents)' "$TAG" | sed '/^$/d' || true)"
          fi
          if [ -z "$msg" ]; then
            echo "tag $TAG 无发布说明（轻量 tag，或 fetch 后仍取不到 annotated 对象），使用模板"
            msg="LiCore ${TAG}

          各平台二进制与 SHA256SUMS 见下方资产。"
          fi
          {
            echo "$msg"
            echo
            echo "---"
            echo
            echo "**校验下载**：每个归档都列入 \`SHA256SUMS\`，可用 \`sha256sum -c SHA256SUMS\` 校验。"
            echo
            echo "**说明**：全部包都是纯 Go 产物（\`CGO_ENABLED=0\`，无 cgo / glibc 依赖）——linux/* 为静态链接，android/darwin 因平台运行时本就是动态链接（与 cgo 无关）。\`licore exec\` 依赖系统自带或可安装的 \`nsenter\`（util-linux、Toybox、busybox 均提供）。"
          } > /tmp/release-notes.md
          echo "Release notes 预览："
          cat /tmp/release-notes.md

      - name: 创建 GitHub Release 并上传资产
        # 只有版本 tag 才创建 Release；非版本 tag 到此为止（构建产物留在
        # runner 上随其销毁，不产生任何公开资产）。
        if: steps.check.outputs.is_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "LiCore ${TAG}" \
            --notes-file /tmp/release-notes.md \
            dist/*.tar.gz dist/SHA256SUMS
          echo "Release 已创建："
          gh release view "$TAG" --json url,assets \
            --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'

      - name: 非版本 tag 的结果说明
        if: steps.check.outputs.is_version != 'true'
        run: |
          echo "tag 不是版本号形态，已完成构建与打包验证，但未创建 Release。"
          echo "如需发布，请使用 v 开头的版本 tag（如 v0.8.0）。"
