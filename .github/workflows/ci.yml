#
# LiCore 持续集成：格式检查 → 静态检查 → 竞态测试 → 全平台交叉编译。
#
# 设计要点：
#   - Go 版本必须 >= go.mod 的 `go` 指令（当前 1.27.1），否则工具链会直接
#     拒绝编译（"go.mod requires go >= X"）。升级 go.mod 时同步改此处。
#   - 交叉编译矩阵覆盖全部声明支持的目标平台；Android cgo 版单独一个 job，
#     因为它需要配置 NDK 工具链，与纯 Go 目标的前置条件不同。
#   - 所有 job 都固定 runner 与 Go 版本，避免"某天突然变红"。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的连续推送只保留最新一次运行。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 与 go.mod 的 `go` 指令保持一致；低于它会构建失败。
  GO_VERSION: "1.27.1"

jobs:
  # 格式 / 静态检查 / 竞态测试：三者都快，合并成一个 job 省启动开销。
  test:
    name: 格式与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 检查格式（未格式化则失败）
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 干净"

      - name: go vet
        run: go vet ./...

      - name: 竞态测试
        # -race 需要 cgo，ubuntu runner 自带 gcc，无需额外安装。
        run: go test -race ./... -count=1

  # 8 平台交叉编译。全部是纯 Go（CGO_ENABLED=0），无 cgo / NDK 依赖。
  cross:
    name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: riscv64 }
          - { goos: android, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 构建
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -o /dev/null .

  # exec 依赖系统的 nsenter，不再依赖 cgo。这里验证：
  #   1) internal/execns 的探测与命令构造在真实环境（装了 util-linux）下通过；
  #   2) 缺 nsenter 时的报错文案可读（用 PATH 隔离模拟）；
  #   3) 真实 nsenter 能被调用（root 下 setns 自己所在的命名空间）。
  exec-nsenter:
    name: exec nsenter 检测（util-linux / busybox）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 确认 runner 自带 nsenter
        run: |
          nsenter --version
          command -v busybox && busybox nsenter --help | head -3 || echo "runner 无 busybox（后备路径仅单测覆盖）"

      - name: 运行 execns 测试
        run: go test ./internal/execns/ -count=1 -v

      - name: 真实 setns 冒烟（需要 root）
        run: |
          sudo --preserve-env=PATH,GOCACHE,GOMODCACHE,GOPATH,HOME \
            "$(command -v go)" test ./internal/execns/ -run TestRealNsenterIfPresent -count=1 -v

      - name: 纯 Go 二进制必须是静态链接（无 glibc 依赖）
        run: |
          CGO_ENABLED=0 go build -o /tmp/licore .
          file /tmp/licore
          if ldd /tmp/licore 2>&1 | grep -q "not a dynamic executable"; then
            echo "OK：静态链接，无动态依赖"
          else
            echo "FAIL：二进制不是静态链接，仍依赖动态库" >&2
            ldd /tmp/licore
            exit 1
          fi
